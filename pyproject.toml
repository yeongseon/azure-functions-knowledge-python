[project]
name = "azure-functions-knowledge"
description = "Knowledge retrieval (RAG) decorators for Azure Functions Python v2"
keywords = ["azure-functions", "azure", "python", "v2", "knowledge", "rag", "retrieval", "notion", "serverless", "binding", "input-binding", "decorator"]
authors = [{ name = "Yeongseon Choe", email = "yeongseon.choe@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # Cap below 2.0.0: azure-functions v2 may change worker function-indexing
    # behavior this package relies on. See #46 / dx#8.
    "azure-functions>=1.22.0,<2.0.0",
]

[project.urls]
Homepage = "https://yeongseon.dev/azure-functions-python/knowledge/"
Documentation = "https://yeongseon.dev/azure-functions-python/knowledge/"
Repository = "https://github.com/yeongseon/azure-functions-knowledge-python"
Issues = "https://github.com/yeongseon/azure-functions-knowledge-python/issues"

[project.optional-dependencies]
notion = ["notion-client>=2.0"]
all = [
    "notion-client>=2.0",
]
dev = [
    "bandit==1.9.4",
    "build",
    "coverage",
    "git-cliff",
    "hatch",
    "mypy==2.3.1",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.16.9",
]
docs = [
    "mkdocs<2.0",
    "mkdocs-material<10.0",
    "mkdocstrings[python]<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_functions_knowledge"]

[tool.hatch.version]
path = "src/azure_functions_knowledge/__init__.py"

[tool.hatch.publish.index]
default = "pypi"

[tool.hatch.publish.index.repos.pypi]
url = "https://upload.pypi.org/legacy/"

[tool.hatch.publish.index.repos.test]
url = "https://test.pypi.org/legacy/"

[tool.hatch.envs.default]
python = "3.10"
features = ["dev", "docs", "all"]

[tool.hatch.envs.default.scripts]
format = "ruff format src tests tools examples"
format-check = "ruff format --check src tests tools examples"
style = "ruff check src tests tools examples && ruff format --check src tests tools examples"
typecheck = "mypy src tests"
lint = "hatch run style && hatch run typecheck"
test = "pytest -v tests"
cov = "pytest --cov-report=term-missing --cov-report=html --cov-report=xml tests/"
docs = "mkdocs serve"
precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
security = "python -m bandit -r src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# C4 + UP keep the codebase on modern syntax (PEP 585/604 generics and
# unions, comprehension forms) instead of the pre-3.10 `typing.List` /
# `Optional[...]` spellings. target-version = "py310" bounds every fix to
# syntax the declared floor supports.
select = ["C4", "E", "F", "I", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# _metadata_helpers.py is the hand-synced copy of a primitive shared verbatim
# with sibling packages, where azure-functions-validation pins its sha256 in
# tests/test_metadata_helpers_drift.py (see #273/#270). UP fixes would rewrite
# its imports and drift this copy away from the others, so the file stays on
# its frozen spelling.
"src/azure_functions_knowledge/_metadata_helpers.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["azure_functions_knowledge"]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "examples.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--cov=src/azure_functions_knowledge --cov-report=xml --cov-report=term-missing -ra -q -m 'not e2e'"
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "e2e: real-Azure end-to-end tests (deselected by default; require E2E_BASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["src/azure_functions_knowledge"]

[tool.coverage.report]
show_missing = true
fail_under = 95
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
