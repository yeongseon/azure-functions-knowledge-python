name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Lint, type-check and workflow hygiene run once on a single pinned
  # interpreter (Python 3.10). These checks are interpreter-agnostic, so
  # fanning them across the matrix would only duplicate work.
  quality:
    name: Lint, type-check & workflow hygiene (Py 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,all]"

      - name: Release-workflow hygiene lint
        run: python tools/lint_release_workflows.py

      - name: Workflow pin-hygiene lint
        run: python tools/lint_workflow_pins.py

      - name: Hatch/matrix hygiene lint
        run: python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src tests

      - name: Security scan (bandit)
        run: python -m bandit -r src

  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # azure-functions is capped to <2.0.0 (the 1.x line), which is only
        # installable on Python <3.13. Python 3.13/3.14 require the 2.x SDK and
        # are tracked separately; advertising them here without a real 2.x lane
        # would be a false signal.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the runtime interpreter matches the matrix cell
        # Belt-and-braces: tests below run directly on this interpreter (raw
        # pytest, NOT the Python-3.10-pinned hatch env), so 3.11/3.12 are
        # genuinely exercised. This guard fails loudly if that ever drifts.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # Python-3.10-pinned hatch env). The repo pytest config enables --cov
        # with fail_under=95 and deselects e2e; tests/e2e is ignored here
        # because it is a separate real-Azure lane and pulls extra deps.
        run: pytest --ignore=tests/e2e

      - name: Verify coverage output
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  # azure-functions 2.x compatibility proof lane (issue #104), following the
  # sibling proof-lane pattern (azure-functions-openapi #529, azure-functions-db
  # #287, azure-functions-validation #348, azure-functions-langgraph #350). This
  # is a SINGLE representative 2.x lane, not a matrix: it builds a WHEEL,
  # installs it, then deliberately overrides the pyproject `<2.0.0` cap to pull
  # `azure-functions>=2,<3` on Python 3.13 and runs the suite against the 2.x
  # SDK. This package is a runtime consumer of `azure-functions` (RAG retrieval
  # decorators / binding injection), so decorator behaviour under the 2.x worker
  # is the risk surface this lane exercises.
  #
  # Gating decision: this lane runs on every PR as a VISIBLE compatibility
  # signal, but it is intentionally NOT a required check -- the runtime cap stays
  # `<2.0.0` until 2.x is certified on real Azure via e2e-azure.yml, so making
  # this blocking before that certification would gate merges on an uncertified
  # runtime. Promote it to a required check via branch protection once the cap is
  # lifted. azure-functions 2.x declares Requires-Python >=3.13, so this lane
  # pins Python 3.13.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source tree,
        # mirroring the sibling proof lanes. Building the distribution artifact
        # also avoids Hatch's default env, which is pinned to Python 3.10 in
        # pyproject and cannot install azure-functions 2.x (Requires-Python
        # >=3.13).
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extras
        run: pip install "$(ls dist/azure_functions_knowledge-*.whl)[dev,all]"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions <2.0.0 until 2.x is certified on real
        # Azure. This lane deliberately overrides that cap to PROVE the package
        # (knowledge decorators, provider registration, client injection) still
        # builds and passes its suite under 2.x. pip warns about the intentional
        # override; that is expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions | grep -E '^(Name|Version):'

      - name: Run compat suite against the wheel + azure-functions 2.x
        # Compatibility smoke only: `--no-cov` disables the coverage gate for this
        # pinned run (a separate job from the coverage-enforcing matrix). The repo
        # pytest config sets `pythonpath = ["src", "."]`, which would shadow the
        # installed wheel with the source tree. We drop `src` (so the
        # wheel-installed package is genuinely exercised) but keep the repo root
        # `.` on the path for conftest/fixtures. e2e is a separate real-Azure lane.
        run: pytest tests/ --ignore=tests/e2e --no-cov -q -o "pythonpath=."
